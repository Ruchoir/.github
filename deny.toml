# cargo-deny configuration shared by every Rust workspace of Ruchoir (golden rule 2 and the licence
# rules), used by .github/workflows/rust.yml. A repository that needs more opens a pull request here:
# it never overrides this file locally.

[graph]
all-features = true

[advisories]
# Every RustSec advisory fails the check, unless it is listed here with the reason and the date.
ignore = [
    # 2026-11-07, decided by Théo. The Marvin attack recovers an RSA private key from the timing of
    # many private-key operations an attacker triggers at will. `rsa` comes in through jwt-simple
    # (Propolis, which signs and verifies ES256 and EdDSA only: no RSA operation runs) and
    # jsonwebtoken (the push relay, which signs one Google token every 40 minutes, cached: nobody
    # can trigger operations). To revisit when `rsa` 0.10 is released, or when a service starts to
    # use RSA keys (RS256 clients of Propolis).
    { id = "RUSTSEC-2023-0071", reason = "no RSA private-key operation an attacker can trigger; see the comment above" },
    # 2026-11-08, decided in autonomy for Théo's review. Typst (0.15.1, the latest) prints the
    # calendar to PDF from a template and a data file the calendar writes itself, with fonts it
    # ships. These advisories sit in Typst's dependencies: two in quick-xml, read only by hayagriva to
    # parse bibliography files (CSL/BibLaTeX) the calendar never hands it, and crates their authors
    # no longer maintain (bincode, paste, rustybuzz, ttf-parser, serde_yaml, yaml-rust), none fed
    # anything a person sends. To revisit at each Typst release.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml under hayagriva: no bibliography is parsed; see the comment above" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml under hayagriva: no bibliography is parsed; see the comment above" },
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained, under Typst; see the comment above" },
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained, under Typst; see the comment above" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained, under Typst; fonts are the calendar's own" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained, under Typst; fonts are the calendar's own" },
    { id = "RUSTSEC-2024-0449", reason = "serde_yaml unmaintained, under Typst; no YAML from a person is read" },
    { id = "RUSTSEC-2024-0320", reason = "yaml-rust unmaintained, under syntect in Typst; no YAML from a person is read" },
    # 2026-11-10, decided in autonomy for Théo's review. The desktop app (Tauri) pulls these on Linux
    # only. zvariant, zbus_names and zvariant_derive come in through zbus, the D-Bus client that
    # shows notifications and the tray icon, on the local desktop bus with local messages only.
    # proc-macro-error is a build-time macro under GTK, through Tauri's Linux tray. All are crates
    # their authors no longer maintain, not vulnerabilities. To revisit at each Tauri release.
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained, under zbus in Tauri; local desktop bus only" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained, under zbus in Tauri; local desktop bus only" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained, under zbus in Tauri; build-time macro" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, under GTK in Tauri; build-time macro" },
]

[licenses]
# Licences a dependency may carry. Copyleft beyond the AGPL family and unknown licences are refused.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # BSD Zero Clause: permissive, without even the attribution of MIT (quoted_printable, under lettre).
    "0BSD",
    # Creative Commons Zero: a public-domain dedication, without any condition (tiny-keccak, built
    # under rust-s3, the drive's client of the object store; decided 2026-11-08).
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "OFL-1.1",
    "CDLA-Permissive-2.0",
    "AGPL-3.0-only",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
# Crates already refused by the dependency rule, with the alternative in use.
deny = [
    { crate = "aws-lc-rs", reason = "AWS crypto provider: use rustls with the ring provider" },
    { crate = "aws-lc-sys", reason = "AWS crypto provider: use rustls with the ring provider" },
    { crate = "aws-sdk-s3", reason = "AWS SDK: use the community rust-s3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[sources.allow-org]
github = ["Ruchoir"]
