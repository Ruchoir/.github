# This repository's own contributor licence agreement check. `pull_request_target` takes the
# workflow, and so the reusable one it calls, from the base branch, never from the pull request.
name: CLA

on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    uses: ./.github/workflows/cla.yml
    secrets:
      signatures-token: ${{ secrets.CLA_SIGNATURES_TOKEN }}
