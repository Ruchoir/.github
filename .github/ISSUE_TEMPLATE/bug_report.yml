name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report this. Please write in English.
        A security vulnerability never goes in an issue: see the [security policy](https://github.com/Ruchoir/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The steps, from the start, that make it happen again.
      placeholder: |
        1. Sign in as an organisation member
        2. Open ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The version or commit of the service, app or package (an instance shows its versions at `/.well-known/ruchoir-product` of each service).
  - type: input
    id: environment
    attributes:
      label: Where it runs
      description: The browser, the phone or the operating system, and how the instance was installed.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any password, token, address or personal content first.
      render: text
